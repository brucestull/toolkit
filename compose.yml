# homelab toolkit app — DEV (as-is) / STAGING (via compose.prod.yml).
x-common-settings: &common-settings
  build:
    context: .
    dockerfile: Dockerfile
    target: release
  depends_on:
    db:
      condition: service_healthy
  environment:
    - "ALLOWED_HOSTS=*"
    - "DATABASE_URL=postgres://postgres@db/postgres"
    - "DJANGO_DEBUG=true"
    # Keep the project venv OUT of /src so the host bind-mount below can't
    # shadow it. Otherwise `uv run` rebuilds the venv on every invocation.
    - "UV_PROJECT_ENVIRONMENT=/opt/venv"
  env_file: .env
  tty: true
  volumes:
    - .:/src:cache
    - django-tailwind-cli-data:/src/.django_tailwind_cli

services:
  db:
    image: "pgautoupgrade/pgautoupgrade:17-alpine"
    restart: unless-stopped
    volumes:
      - .:/src:cache
      - postgres-data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
    healthcheck:
      # CMD-SHELL takes a single command string; passing args as extra list
      # items silently drops them. Use the full command as one string.
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres -q" ]
      # `start_interval` (Docker 25+) lets us poll aggressively during boot
      # and relax once the container is healthy.
      interval: 30s
      start_interval: 1s
      start_period: 20s
      timeout: 3s
      retries: 5
    user: postgres
    init: true

  tailwind:
    command: [ "/src/start-tailwind.sh" ]
    <<: *common-settings
    init: true

  utility:
    command: [ "uv", "run", "--no-sync", "-m", "manage", "--version" ]
    entrypoint: [ "/src/compose-entrypoint.sh" ]
    <<: *common-settings

  web:
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped
    command: [ "/src/start-dev.sh" ]
    networks:
      - default
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=web"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8000"
    healthcheck:
      test: [ "CMD-SHELL", "/src/healthcheck-web.sh" ]
      interval: 30s
      start_interval: 2s
      start_period: 60s
      timeout: 5s
      retries: 3
    <<: *common-settings
    init: true

  worker:
    command: [ "/src/start-worker.sh" ]
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/src/healthcheck-worker.sh" ]
      interval: 30s
      start_interval: 3s
      start_period: 60s
      timeout: 10s
      retries: 3
    <<: *common-settings
    init: true

volumes:
  django-tailwind-cli-data:
  postgres-data:

networks:
  edge:
    external: true
